tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a list of contacts for the authenticated user
security:
  - bearerAuth: []

parameters:
  - name: isFavourite
    in: query
    description: Filter contacts by favourite
    required: false
    schema:
      type: boolean
    example: true

  - name: contactType
    in: query
    description: Filter contacts by type
    required: false
    schema:
      type: string
      enum: [work, home, personal]
    example: work

  - name: page
    in: query
    description: Pagination - page number
    required: false
    schema:
      type: integer
      minimum: 1
    example: 1

  - name: perPage
    in: query
    description: Pagination - items per page
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
    example: 10

responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: 64fa4567a0c1c7e27f7df0b2
                      name:
                        type: string
                        example: John Doe
                      phoneNumber:
                        type: string
                        example: '+1234567890'
                      email:
                        type: string
                        example: john@example.com
                      isFavourite:
                        type: boolean
                        example: false
                      contactType:
                        type: string
                        example: personal
                      photo:
                        type: string
                        example: https://example.com/photo.png
                      userId:
                        type: string
                        example: 64fa4567a0c1c7e27f7df0b1
                      createdAt:
                        type: string
                        format: date-time
                        example: '2025-08-14T10:23:45.000Z'
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2025-08-14T11:00:00.000Z'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 49
                totalPages:
                  type: integer
                  example: 5
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false

  '401':
    $ref: '../components/responses/401.yaml'

  '500':
    $ref: '../components/responses/500.yaml'
