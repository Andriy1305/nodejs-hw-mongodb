tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Returns a list of contacts with optional filters, sorting and pagination
parameters:
  - name: sortBy
    in: query
    description: Field to sort by (e.g. name, email, phone)
    required: false
    schema:
      type: string
      enum: [name, email, phone]
  - name: sortOrder
    in: query
    description: Sort order direction
    required: false
    schema:
      type: string
      enum: [asc, desc]
  - name: page
    in: query
    description: Page number (for pagination)
    required: false
    schema:
      type: integer
      minimum: 1
  - name: perPage
    in: query
    description: Number of results per page
    required: false
    schema:
      type: integer
      minimum: 1
  - name: name
    in: query
    description: Filter by contact name
    required: false
    schema:
      type: string
  - name: email
    in: query
    description: Filter by email
    required: false
    schema:
      type: string
  - name: phone
    in: query
    description: Filter by phone
    required: false
    schema:
      type: string
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts
            data:
              type: array
              items:
                $ref: '../components/schemas/contact.yaml'

  '401':
    description: Unauthorized
  '500':
    description: Server error
