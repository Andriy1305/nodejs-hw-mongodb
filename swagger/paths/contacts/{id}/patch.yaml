tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update contact
security:
  - bearerAuth: []

parameters:
  - name: id
    in: path
    description: ID of the contact to update
    required: true
    schema:
      type: string
      example: 64fa4567a0c1c7e27f7df0b2

requestBody:
  description: Update contact
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Jane Doe
          phoneNumber:
            type: string
            example: '+1234567890'
          email:
            type: string
            example: jane@example.com
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            type: string
            format: binary
      encoding:
        photo:
          contentType: image/jpeg
responses:
  '200':
    description: Successfully patched a contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              properties:
                _id:
                  type: string
                  example: 64fa4567a0c1c7e27f7df0b2
                name:
                  type: string
                  example: Jane Doe
                phoneNumber:
                  type: string
                  example: '+1234567890'
                email:
                  type: string
                  example: jane@example.com
                isFavourite:
                  type: boolean
                  example: true
                contactType:
                  type: string
                  example: work
                photo:
                  type: string
                  example: https://example.com/photo.png
                userId:
                  type: string
                  example: 64fa4567a0c1c7e27f7df0b1
                createdAt:
                  type: string
                  format: date-time
                  example: '2025-08-14T10:23:45.000Z'
                updatedAt:
                  type: string
                  format: date-time
                  example: '2025-08-14T11:00:00.000Z'

  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
